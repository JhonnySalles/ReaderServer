version: "3.8"

services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: readerserver-db
    restart: always
    environment:
      POSTGRES_DB: readerserver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reader-network

  # Servidor Backend (ReaderServer API)
  readerserver-api:
    image: readerserver-server:latest
    container_name: readerserver-api
    restart: always
    depends_on:
      - postgres
    environment:
      # Conexão com o PostgreSQL existente via host
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/readerserver
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root

      # Gravação de logs no diretório do volume montado
      LOG_FILE: /app/logs/server.log
      LOGGING_FILE_NAME: /app/logs/server.log

      # Configurações do servidor e JVM
      PORT: 8083
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC"

      # CORS e Segurança
      CORS_ORIGINPATTERNS: "http://localhost:5179,http://localhost:8083"
      SECURITY_JWT_TOKEN_SECRET_KEY: "minha_chave_secreta_super_segura"
      SECURITY_JWT_TOKEN_EXPIRE_LENGTH: 86400000
      DESCOBERTALOCAL: "true"
    volumes:
      # No Windows: mapeia para a pasta local ./logs
      # No Raspberry Pi: altere para /logs/readerserver:/app/logs
      - ./logs:/app/logs
    ports:
      - "8083:8083"
    networks:
      - reader-network

  # Frontend Web (React + Nginx)
  readerserver-web:
    image: readerserver-frontend:latest
    container_name: readerserver-web
    restart: always
    depends_on:
      - readerserver-api
    environment:
      VITE_API_BASE_URL: "http://localhost:8083"
      VITE_API_USERNAME: "admin"
      VITE_API_PASSWORD: "admin"
    ports:
      - "5179:80"
    networks:
      - reader-network

networks:
  reader-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
