# Configuração de Produção para o ambiente Alwaysdata (User Program / Programa do Usuário)
cors:
  originPatterns: ${CORS_ALLOWED_ORIGINS:*}

security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY:53cr37}
      expire-length: ${JWT_EXPIRE_LENGTH:86400000} # 24h
  apikey: ${SECURITY_API_KEY:53cr37-api-key}

spring:
  application:
    name: ReaderServer
  datasource:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/readerserver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      show-sql: false
      format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8083}
  address: ${IP:0.0.0.0}
  forward-headers-strategy: framework
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/readerserver}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  pathsToMatch:
    - /health/**
    - /auth/**
    - /api/**
  swagger-ui:
    path: /api/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  file:
    name: ${LOG_FILE:logs/server.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    br.com.fenix.readerserver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

api:
  version: ${API_VERSION:1.0.0}
