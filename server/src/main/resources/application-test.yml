cors:
  originPatterns: http://localhost:3000,http://localhost:8080
security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 86400000 # 24h
spring:
  application:
    name: ReaderServer
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true
      format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
server:
  port: 8888
springdoc:
  pathsToMatch:
    - /health/**
    - /auth/**
    - /api/**
logging:
  file:
    name: ../logs/server-test.log
descobertaLocal: false
