cors:
  originPatterns: http://localhost:3000,http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:5179
security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 86400000 # 24h (24 * 60 * 60 * 1000)
spring:
  application:
    name: ReaderServer
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/readerserver
    username: postgres
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true
      format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
server:
  port: ${PORT:8083}
  address: ${IP:0.0.0.0}
  forward-headers-strategy: framework
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}
springdoc:
  api-docs:
    path: /api/v3/api-docs
  pathsToMatch:
    - /health/**
    - /auth/**
    - /api/**
  swagger-ui:
    path: /api/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  file:
    name: ${LOG_FILE:logs/server.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
api:
  version: 1.0.0
