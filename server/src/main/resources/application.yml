cors:
  originPatterns: http://localhost:3000,http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:5179
security:
  jwt:
    token:
      secret-key: 53cr37
      expire-length: 3600000
spring:
  application:
    name: ReaderServer
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/readerserver
    username: postgres
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true
      format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/{vendor}
server:
  port: 8083
springdoc:
  pathsToMatch:
    - /health/**
    - /auth/**
    - /api/**
  swagger-ui:
    use-root-path: true
    tags-sorter: alpha
    operations-sorter: alpha
logging:
  file:
    name: server.log
descobertaLocal: true
