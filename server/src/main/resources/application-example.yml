# Configurações de CORS permitidos (separados por vírgula)
cors:
  originPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:5179}

# Segurança JWT
security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY:53cr37}
      expire-length: ${JWT_EXPIRE_LENGTH:3600000}

spring:
  application:
    name: ReaderServer
  datasource:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    url: ${DB_URL:jdbc:postgresql://localhost:5433/readerserver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      show-sql: false
      format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/{vendor}

server:
  port: ${PORT:8083}

springdoc:
  pathsToMatch:
    - /health/**
    - /auth/**
    - /api/**
  swagger-ui:
    use-root-path: true
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  file:
    name: /app/logs/server.log

descobertaLocal: ${MDNS_DISCOVERY_ENABLED:true}
