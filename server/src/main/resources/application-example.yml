# Configurações de CORS permitidos (separados por vírgula)
cors:
  originPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:5179}

# Segurança JWT
security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY:53cr37}
      expire-length: ${JWT_EXPIRE_LENGTH:86400000} # 24h

spring:
  application:
    name: ReaderServer
  datasource:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    url: ${DB_URL:jdbc:postgresql://localhost:5433/readerserver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      show-sql: false
      format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8083}
  address: ${IP:0.0.0.0}
  forward-headers-strategy: framework

springdoc:
  pathsToMatch:
    - /health/**
    - /auth/**
    - /api/**
  swagger-ui:
    use-root-path: true
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  file:
    name: ${LOG_FILE:logs/server.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

api:
  version: ${API_VERSION:1.0.0}
