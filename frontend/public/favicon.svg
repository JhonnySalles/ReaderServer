<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente de fundo do ícone -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradiente dos Livros / Biblioteca -->
    <linearGradient id="book1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="book2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="book3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="book4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Gradiente do Rack de Servidor -->
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Brilho sutil dos LEDs -->
    <filter id="ledGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo: Squircle elegante com borda sutil -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />

  <!-- === SEÇÃO 1: BIBLIOTECA (Coleção de Livros com lombadas sólidas) === -->
  <!-- Estante / Suporte base dos livros -->
  <rect x="9" y="32" width="46" height="2" rx="1" fill="#475569" />

  <!-- Livro 1 (Índigo) -->
  <rect x="11" y="11" width="8" height="21" rx="2" fill="url(#book1Grad)" />
  <rect x="13" y="14" width="4" height="2" rx="0.5" fill="#e0e7ff" fill-opacity="0.8" />
  <rect x="13" y="18" width="4" height="2" rx="0.5" fill="#e0e7ff" fill-opacity="0.6" />

  <!-- Livro 2 (Azul Ciano) -->
  <rect x="21" y="8" width="8" height="24" rx="2" fill="url(#book2Grad)" />
  <rect x="23" y="12" width="4" height="2.5" rx="0.5" fill="#f0f9ff" fill-opacity="0.85" />
  <rect x="23" y="24" width="4" height="2" rx="0.5" fill="#f0f9ff" fill-opacity="0.6" />

  <!-- Livro 3 (Roxo Violeta) -->
  <rect x="31" y="13" width="8" height="19" rx="2" fill="url(#book3Grad)" />
  <rect x="33" y="16" width="4" height="2" rx="0.5" fill="#faf5ff" fill-opacity="0.8" />

  <!-- Livro 4 (Inclinado / Rosa Coral) -->
  <g transform="translate(41, 13) rotate(16)">
    <rect x="0" y="0" width="7.5" height="19" rx="2" fill="url(#book4Grad)" />
    <rect x="1.5" y="4" width="4.5" height="2" rx="0.5" fill="#fff1f2" fill-opacity="0.8" />
  </g>

  <!-- Marcador de livro / Fita decorativa descendo -->
  <path d="M 25 32 L 25 35 L 26.5 34 L 28 35 L 28 32 Z" fill="#38bdf8" />

  <!-- === SEÇÃO 2: SERVIDOR (Rack de Servidor com LEDs de status e slots) === -->
  <!-- Chassi principal do servidor -->
  <rect x="9" y="37" width="46" height="19" rx="3.5" fill="url(#serverGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Linha divisória de bandejas de servidor -->
  <line x1="9" y1="46.5" x2="55" y2="46.5" stroke="#1e293b" stroke-width="1.5" />

  <!-- Bandeja Superior (Slots de disco / ventilação e LED verde de atividade) -->
  <circle cx="15" cy="42" r="2" fill="#10b981" filter="url(#ledGlow)" />
  <circle cx="21" cy="42" r="2" fill="#38bdf8" filter="url(#ledGlow)" />
  <rect x="28" y="40.5" width="22" height="3" rx="1.5" fill="#334155" />
  <rect x="30" y="41.2" width="6" height="1.6" rx="0.8" fill="#64748b" />

  <!-- Bandeja Inferior (LED roxo de banco de dados e gavetas de armazenamento) -->
  <circle cx="15" cy="51.5" r="2" fill="#a855f7" filter="url(#ledGlow)" />
  <circle cx="21" cy="51.5" r="2" fill="#64748b" />
  <rect x="28" y="50" width="10" height="3" rx="1.5" fill="#334155" />
  <rect x="40" y="50" width="10" height="3" rx="1.5" fill="#334155" />
</svg>